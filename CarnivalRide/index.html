<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portfolio Project 1 | Carnival Ride</title>
    <meta name="description" content="">
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <style>
      :root {
        --panel-bg: rgba(14, 16, 26, 0.72);
        --panel-border: rgba(255, 255, 255, 0.09);
        --text: #f4f5fa;
        --text-muted: #a3a8bf;
        --accent: #ffb547;
        --accent-strong: #ff8a3d;
        --btn-bg: rgba(255, 255, 255, 0.06);
        --btn-bg-hover: rgba(255, 255, 255, 0.12);
        --btn-border: rgba(255, 255, 255, 0.14);
        --focus: #7cc4ff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0c12;
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #0b0c12;
        touch-action: none;
      }

      .panel {
        position: fixed;
        top: 20px;
        left: 20px;
        width: 270px;
        padding: 24px 20px 20px;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 20px;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      }

      .title {
        margin: 0;
        font-size: 27px;
        line-height: 1.1;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .subtitle {
        margin: 6px 0 0;
        font-size: 16px;
        font-weight: 500;
        color: var(--accent);
        letter-spacing: 0.02em;
      }

      .status {
        margin: 10px 0 20px 0;
        min-height: 18px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .look {
        margin: 10px 0 0 0;
        min-height: 18px;
        font-size: 13px;
        color: var(--text-muted);
      }

      .progress {
        margin-top: 10px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }

      .progress-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, var(--accent), var(--accent-strong));
        transition: width 0.2s ease;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 20px;
      }

      .btn {
        appearance: none;
        width: 100%;
        height: 46px;
        padding: 0 16px;
        border: 1px solid var(--btn-border);
        border-radius: 12px;
        background: var(--btn-bg);
        color: var(--text);
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        cursor: pointer;
        transition: background 0.18s ease, border-color 0.18s ease, transform 0.18s ease,
                    box-shadow 0.18s ease, opacity 0.18s ease;
      }

      .btn:hover:not(:disabled) {
        background: var(--btn-bg-hover);
        border-color: var(--accent);
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(255, 150, 60, 0.22);
      }

      .btn:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: none;
      }

      .btn:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }

      .btn:disabled {
        opacity: 0.38;
        cursor: not-allowed;
      }

      .btn-primary {
        border-color: transparent;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #1a1206;
      }

      .btn-primary:hover:not(:disabled) {
        background: linear-gradient(135deg, #ffc266, #ff9a52);
        border-color: transparent;
        box-shadow: 0 10px 26px rgba(255, 138, 61, 0.4);
      }

      @media (prefers-reduced-motion: reduce) {
        .btn, .progress-fill { transition: none; }
        .btn:hover:not(:disabled) { transform: none; }
      }

      /* Phones: stretch across the top with a 16px gutter. */
      @media (max-width: 640px) {
        .panel {
          top: 16px;
          left: 16px;
          right: 16px;
          width: auto;
          padding: 18px 16px 16px;
        }
        .title { font-size: 22px; }
        .subtitle { font-size: 14px; }
        .status { margin-top: 12px; }
        .actions { margin-top: 14px; gap: 8px; }
        .btn { height: 44px; }
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <aside class="panel">
      <h1 class="title">Portfolio Project 1</h1>
      <p class="subtitle">Carnival Ride</p>

      <p class="look" id="look"></p>
      <p class="status" id="status">Loading&hellip;</p>
      <div class="progress" id="progress"><div class="progress-fill" id="progress-fill"></div></div>

      <div class="actions">
        <button class="btn" id="switch-view" disabled>Switch View</button>
        <button class="btn btn-primary" id="start-ride" disabled>Start Ride</button>
        <button class="btn" id="enter-vr" disabled>Enter VR</button>
      </div>
    </aside>

    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/CarnivalRide.loader.js";
      var config = {
        dataUrl: buildUrl + "/CarnivalRide.data",
        frameworkUrl: buildUrl + "/CarnivalRide.framework.js",
        codeUrl: buildUrl + "/CarnivalRide.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "portfolio-1-gl01998",
        productVersion: "1.0",
      };

      var canvas = document.getElementById("unity-canvas");
      var lookText = document.getElementById("look");
      var statusText = document.getElementById("status");
      var progress = document.getElementById("progress");
      var progressFill = document.getElementById("progress-fill");
      var switchViewButton = document.getElementById("switch-view");
      var startRideButton = document.getElementById("start-ride");
      var enterVRButton = document.getElementById("enter-vr");
      var unityInstance = null;
      var rideState = null; // { seated, running } once the game reports it
      var vrSupported = false;
      

      function updateControls() {
        var loaded = unityInstance !== null;
        switchViewButton.disabled = !loaded || (rideState !== null && rideState.running);
        // Without state from the game, leave Start Ride on; WebBridge still refuses a bad start.
        startRideButton.disabled = !loaded || (rideState !== null && (!rideState.seated || rideState.running));
        enterVRButton.disabled = !loaded || !vrSupported;

        if (!loaded) return;
        if (rideState === null) statusText.textContent = "";
        else if (rideState.running) statusText.textContent = "Ride in progress";
        else if (rideState.seated) statusText.textContent = "Seated — ready to ride";
        else statusText.textContent = "Standing on the ground";

        if (rideState == null) lookText.textContent = "";
        else lookText.textContent = "Drag with your mouse to look";
      }

      // Sent by WebBridge (Assets/Plugins/WebGL/WebBridge.jslib) when seat or ride state changes.
      document.addEventListener("unityRideState", function (event) {
        rideState = event.detail;
        updateControls();
      });

      // Sent by the WebXR Export package once it knows whether VR is available.
      document.addEventListener("onVRSupportedCheck", function (event) {
        vrSupported = event.detail.supported;
        updateControls();
      });

      switchViewButton.addEventListener("click", function () {
        unityInstance.SendMessage("WebBridge", "ToggleSeat");
      });
      startRideButton.addEventListener("click", function () {
        unityInstance.SendMessage("WebBridge", "StartRide");
      });
      enterVRButton.addEventListener("click", function () {
        unityInstance.Module.WebXR.toggleVR();
      });

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (value) {
          progressFill.style.width = 100 * value + "%";
          statusText.textContent = "Loading… " + Math.round(100 * value) + "%";
        }).then(function (instance) {
          unityInstance = instance;
          progress.style.display = "none";
          updateControls();
        }).catch(function (message) {
          statusText.textContent = "Failed to load: " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
